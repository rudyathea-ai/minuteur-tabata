<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Minuteur Tabata</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<style>
/* ===== Couleurs : jetons clairs par défaut, sombres si le système le demande ===== */
:root{
  --bg:#f3f4f7; --fg:#12151c; --panel:#ffffff; --line:#c9ced9; --muted:#4a5163;
  --btn:#12151c; --btnfg:#ffffff; --err:#b3261e;
  /* Couleurs des phases : texte blanc, contraste > 5:1 */
  --p-idle:#1b1f2a; --p-ex:#c4200d; --p-rest:#0a6a86; --p-srest:#5a3dcf; --p-done:#0f7a3c;
  color-scheme:light;
  box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f14; --fg:#f2f4f8; --panel:#181c25; --line:#3a4153; --muted:#b4bccd;
    --btn:#ffffff; --btnfg:#12151c; --err:#ff9a92; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f14; --fg:#f2f4f8; --panel:#181c25; --line:#3a4153; --muted:#b4bccd;
  --btn:#ffffff; --btnfg:#12151c; --err:#ff9a92; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
  font:500 1.0625rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}
body.has-ad{padding-bottom:70px}
button,input{font:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}

/* ===== Écran du minuteur : toute la zone prend la couleur de la phase ===== */
.stage{
  min-height:56svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.5rem; padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1rem 1.5rem;
  background:var(--p-idle); color:#fff; text-align:center; transition:background .25s;
}
body[data-phase="ex"] .stage{background:var(--p-ex)}
body[data-phase="rest"] .stage{background:var(--p-rest)}
body[data-phase="srest"] .stage{background:var(--p-srest)}
body[data-phase="done"] .stage{background:var(--p-done)}
.phase{margin:0;font-size:clamp(1.6rem,8vw,2.6rem);font-weight:800;letter-spacing:.02em;line-height:1.1}
.phase.flash{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.phase.flash{animation:none}.stage{transition:none}}
.time{
  font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  font-weight:800; font-variant-numeric:tabular-nums; line-height:.95;
  font-size:clamp(7rem,40vw,15rem); margin:.1em 0;
}
.progress{display:flex;gap:.6rem 1.5rem;justify-content:center;flex-wrap:wrap;font-size:1.25rem;font-weight:700}
.bar{width:min(100%,26rem);height:10px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff}
.hint{margin:0;min-height:1.5em;font-size:1.05rem}

/* ===== Commandes ===== */
.controls{display:flex;gap:.75rem;padding:1rem;max-width:34rem;margin:0 auto}
.btn{border:0;border-radius:16px;min-height:64px;font-weight:800;cursor:pointer}
.main{flex:2;background:var(--btn);color:var(--btnfg);font-size:1.6rem}
.reset{flex:1;background:transparent;color:var(--fg);border:2px solid var(--fg);font-size:1.1rem}

/* ===== Réglages ===== */
.settings{max-width:34rem;margin:0 auto;padding:0 1rem 1.5rem}
.settings h2{font-size:1.25rem;margin:.5rem 0 .75rem}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.75rem .9rem;margin-bottom:.6rem;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:.25rem .75rem}
.row label{font-weight:700}
.step{display:flex;align-items:center;gap:.4rem}
.step button{width:48px;height:48px;border-radius:12px;border:2px solid var(--fg);background:transparent;color:var(--fg);font-size:1.6rem;font-weight:800;cursor:pointer;line-height:1}
.step input{width:5.2rem;height:48px;text-align:center;font-size:1.4rem;font-weight:800;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.step input[aria-invalid="true"]{border-color:var(--err)}
.err{grid-column:1/-1;margin:0;color:var(--err);font-size:.95rem;font-weight:600}
.err:empty{display:none}
button:disabled,input:disabled{opacity:.45;cursor:not-allowed}
.total{color:var(--muted);margin:.25rem 0 0}

/* ===== Bannière publicitaire (masquée tant qu’elle n’est pas configurée) ===== */
#ad{position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:center;align-items:center;overflow:hidden;z-index:5}
#ad[hidden]{display:none}
</style>
</head>
<body data-phase="idle">

<main class="stage">
  <p class="phase" id="phase" aria-live="polite">PRÊT</p>
  <div class="time" id="time" role="timer" aria-label="Temps restant">00:20</div>
  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <div class="progress">
    <span id="cycle">Cycle 1/8</span>
    <span id="serie">Série 1/2</span>
  </div>
  <p class="hint" id="hint">Appuyez sur Démarrer</p>
</main>

<div class="controls">
  <button class="btn main" id="go" type="button">Démarrer</button>
  <button class="btn reset" id="reset" type="button">Réinitialiser</button>
</div>

<section class="settings" aria-labelledby="h-set">
  <h2 id="h-set">Réglages</h2>
  <div id="fields"></div>
  <p class="total" id="total"></p>
</section>

<!-- Emplacement publicitaire : reste caché si AD_CLIENT / AD_SLOT sont vides -->
<div id="ad" hidden aria-label="Publicité"></div>

<script>
"use strict";

/* ============================================================
   CONFIGURATION DES PUBLICITÉS (Google AdSense)
   Laissez vides pour ne pas afficher de bannière.
   ============================================================ */
const AD_CLIENT = "";  // ex. "ca-pub-1234567890123456"
const AD_SLOT   = "";  // ex. "1234567890"

/* ---- Application Android (Capacitor) : publicité AdMob ---- */
const NATIF = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PLUG  = (window.Capacitor && window.Capacitor.Plugins) || {};
// ID de bannière de TEST fourni par Google. Remplacez-le par le vôtre avant publication,
// et passez ADMOB_TEST à false.
const ADMOB_BANNER_ID = "ca-app-pub-3940256099942544/6300978111";
const ADMOB_TEST = true;

async function initAdMob() {
  const A = PLUG.AdMob;
  if (!A || !ADMOB_BANNER_ID) return;           // pas configuré : aucune pub, aucune erreur
  try {
    // Consentement RGPD (obligatoire dans l’Espace économique européen)
    const info = await A.requestConsentInfo();
    if (info.isConsentFormAvailable && info.status === "REQUIRED") await A.showConsentForm();
    await A.initialize();
    await A.showBanner({ adId: ADMOB_BANNER_ID, adSize: "ADAPTIVE_BANNER",
                         position: "BOTTOM_CENTER", margin: 0, isTesting: ADMOB_TEST });
    document.body.classList.add("has-ad");      // laisse la place à la bannière
  } catch (e) {}
}

/* ============================================================
   RÉGLAGES : valeurs par défaut, limites et description des champs
   Durées en secondes ; compteurs en nombre entier.
   ============================================================ */
const DEFAUTS = { ex:20, rest:10, cycles:8, series:2, srest:60 };
const LIMITES = { ex:[5,600], rest:[0,600], cycles:[1,50], series:[1,20], srest:[0,600] };
const CHAMPS = [
  { k:"ex",     label:"Durée de l’exercice",     type:"temps", pas:5 },
  { k:"rest",   label:"Repos entre deux cycles", type:"temps", pas:5 },
  { k:"cycles", label:"Cycles par série",        type:"nombre", pas:1 },
  { k:"series", label:"Nombre de séries",        type:"nombre", pas:1 },
  { k:"srest",  label:"Repos entre les séries",  type:"temps", pas:5 }
];
const CLE = "tabata-reglages";

let R = { ...DEFAUTS };
try { Object.assign(R, JSON.parse(localStorage.getItem(CLE) || "{}")); } catch (e) {}
// Sécurité : ignore toute valeur enregistrée hors limites
for (const k in LIMITES) {
  const [a, b] = LIMITES[k];
  if (!Number.isInteger(R[k]) || R[k] < a || R[k] > b) R[k] = DEFAUTS[k];
}
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(R)); } catch (e) {} };

/* ============================================================
   OUTILS
   ============================================================ */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const mmss = s => pad(Math.floor(s / 60)) + ":" + pad(s % 60);
const clamp = (v, [a, b]) => Math.min(b, Math.max(a, v));

/* ============================================================
   PLAN DE SÉANCE
   Liste ordonnée de phases : exercice, repos, repos entre séries.
   Pas de repos après le dernier cycle d’une série (il est remplacé par le
   repos entre séries) ni après la toute dernière série.
   ============================================================ */
const NOMS = { ex:"EXERCICE", rest:"REPOS", srest:"REPOS ENTRE LES SÉRIES" };
const ANNONCES = { ex:"Exercice !", rest:"Repos", srest:"Repos entre les séries" };

function construirePlan() {
  const plan = [];
  for (let s = 1; s <= R.series; s++) {
    for (let c = 1; c <= R.cycles; c++) {
      plan.push({ type:"ex", d:R.ex, c, s });
      if (c < R.cycles) {
        if (R.rest > 0) plan.push({ type:"rest", d:R.rest, c:c + 1, s }); // montre le cycle à venir
      } else if (s < R.series && R.srest > 0) {
        plan.push({ type:"srest", d:R.srest, c:1, s:s + 1 });             // montre la série à venir
      }
    }
  }
  return plan;
}

/* ============================================================
   ÉTAT DU MINUTEUR
   Le temps est calculé à partir de l’horloge (Date.now) et non en comptant
   les ticks : le compteur reste juste même si le navigateur ralentit ou
   suspend les timers (écran verrouillé, arrière-plan).
   ============================================================ */
let etat = "idle";          // idle | run | pause | done
let plan = [], i = 0;       // phase courante
let finPhase = 0;           // instant (ms) de fin de la phase, quand run
let restant = 0;            // ms restantes, quand pause
let dernSec = -1;           // pour ne biper qu’une fois par seconde
let timer = null, verrou = null, audio = null;

function demarrer() {
  if (etat === "idle" || etat === "done") {
    plan = construirePlan(); i = 0;
    restant = plan[0].d * 1000;
    signaler(true);
  }
  finPhase = Date.now() + restant;
  etat = "run";
  clearInterval(timer);
  timer = setInterval(tick, 100);
  demanderVerrou();
  maj();
}
function pause() {
  restant = Math.max(0, finPhase - Date.now());
  etat = "pause";
  clearInterval(timer);
  maj();
}
function reinitialiser() {
  clearInterval(timer);
  etat = "idle"; plan = []; i = 0; dernSec = -1;
  libererVerrou();
  maj();
}

function tick() {
  if (etat !== "run") return;
  const now = Date.now();
  let change = false;
  // Rattrapage : si l’appli a dormi, on avance de plusieurs phases d’un coup
  while (now >= finPhase) {
    i++;
    if (i >= plan.length) { terminer(); return; }
    finPhase += plan[i].d * 1000;
    change = true;
  }
  restant = finPhase - now;
  if (change) { dernSec = -1; signaler(false); }
  const sec = Math.ceil(restant / 1000);
  if (sec !== dernSec) {
    dernSec = sec;
    if (sec >= 1 && sec <= 3 && !change) bip(660, 0.12);   // compte à rebours 3-2-1
  }
  maj();
}

function terminer() {
  clearInterval(timer);
  etat = "done"; restant = 0;
  libererVerrou();
  bip(880, 0.25); setTimeout(() => bip(880, 0.25), 350); setTimeout(() => bip(1175, 0.5), 700);
  vibrer([300, 120, 300, 120, 600]);
  maj();
}

/* ============================================================
   SON, VIBRATION, ANIMATION
   (le son et la vibration dépendent de la plateforme et peuvent être
   coupés par le système quand l’écran est verrouillé)
   ============================================================ */
function bip(freq, duree) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.type = "square";
    g.gain.setValueAtTime(0.15, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duree);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + duree);
  } catch (e) {}
}
function vibrer(m) { try { navigator.vibrate && navigator.vibrate(m); } catch (e) {} }

// Changement de phase : bip long, vibration et petite animation du titre
function signaler(premiere) {
  bip(plan[i].type === "ex" ? 988 : 523, 0.4);
  vibrer(plan[i].type === "ex" ? [200] : [100, 80, 100]);
  const p = $("phase");
  p.classList.remove("flash"); void p.offsetWidth; p.classList.add("flash");
}

// Empêche la mise en veille de l’écran pendant la séance
async function demanderVerrou() {
  if (NATIF && PLUG.KeepAwake) { try { await PLUG.KeepAwake.keepAwake(); } catch (e) {} return; }
  try { if ("wakeLock" in navigator && !verrou) verrou = await navigator.wakeLock.request("screen"); } catch (e) { verrou = null; }
  if (verrou) verrou.addEventListener("release", () => { verrou = null; });
}
function libererVerrou() { if (NATIF && PLUG.KeepAwake) { try { PLUG.KeepAwake.allowSleep(); } catch (e) {} return; } try { verrou && verrou.release(); } catch (e) {} verrou = null; }

// Au retour au premier plan : on recalcule tout de suite et on reprend le verrou
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && etat === "run") { tick(); demanderVerrou(); }
});

/* ============================================================
   AFFICHAGE
   ============================================================ */
function maj() {
  const b = document.body, bouton = $("go");
  let phase = "idle", titre = "PRÊT", sec, c = 1, s = 1, frac = 0, hint = "";

  if (etat === "idle") {
    sec = R.ex; hint = "Appuyez sur Démarrer";
  } else if (etat === "done") {
    phase = "done"; titre = "Séance terminée !"; sec = 0;
    c = R.cycles; s = R.series; frac = 1; hint = "Bravo, bien joué !";
  } else {
    const p = plan[i];
    phase = p.type; titre = NOMS[p.type]; c = p.c; s = p.s;
    sec = Math.ceil(restant / 1000);
    frac = 1 - restant / (p.d * 1000);
    hint = etat === "pause" ? "En pause" : (p.type === "ex" ? "Donnez tout !" : "Récupérez, prochain : " + (p.type === "srest" ? "série " + p.s : "cycle " + p.c));
  }
  b.dataset.phase = phase;
  $("phase").textContent = titre;
  $("time").textContent = mmss(sec);
  $("cycle").textContent = "Cycle " + c + "/" + R.cycles;
  $("serie").textContent = "Série " + s + "/" + R.series;
  $("hint").textContent = hint;
  $("fill").style.width = Math.max(0, Math.min(1, frac)) * 100 + "%";
  bouton.textContent = etat === "run" ? "Pause" : etat === "pause" ? "Reprendre" : etat === "done" ? "Recommencer" : "Démarrer";

  // Les réglages sont verrouillés pendant la séance
  const verrouille = etat === "run" || etat === "pause";
  document.querySelectorAll("#fields input, #fields button").forEach(el => el.disabled = verrouille);
  $("total").textContent = "Durée totale de la séance : " + mmss(dureeTotale());
  document.title = etat === "run" ? mmss(sec) + " · " + titre : "Minuteur Tabata";
}
function dureeTotale() { return construirePlan().reduce((t, p) => t + p.d, 0); }

/* ============================================================
   CHAMPS DE RÉGLAGE : boutons − / + et saisie directe avec validation
   ============================================================ */
function analyser(champ, texte) {
  const t = texte.trim();
  if (champ.type === "nombre") return /^\d{1,3}$/.test(t) ? parseInt(t, 10) : NaN;
  let m = t.match(/^(\d{1,2}):([0-5]?\d)$/);            // « m:ss »
  if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  return /^\d{1,3}$/.test(t) ? parseInt(t, 10) : NaN;   // ou un nombre de secondes
}
const afficher = (champ, v) => champ.type === "temps" ? mmss(v) : String(v);

function construireChamps() {
  const zone = $("fields");
  CHAMPS.forEach(ch => {
    const [a, b] = LIMITES[ch.k];
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML =
      '<label for="in-' + ch.k + '">' + ch.label + '</label>' +
      '<div class="step"><button type="button" aria-label="Diminuer">−</button>' +
      '<input id="in-' + ch.k + '" inputmode="numeric" autocomplete="off">' +
      '<button type="button" aria-label="Augmenter">+</button></div>' +
      '<p class="err" role="alert"></p>';
    zone.appendChild(row);
    const input = row.querySelector("input"), err = row.querySelector(".err");
    const [moins, plus] = row.querySelectorAll("button");
    input.value = afficher(ch, R[ch.k]);

    const valider = () => {
      const v = analyser(ch, input.value);
      if (Number.isNaN(v) || v < a || v > b) {
        input.setAttribute("aria-invalid", "true");
        err.textContent = ch.type === "temps"
          ? "Durée invalide : saisissez par exemple 0:20, entre " + mmss(a) + " et " + mmss(b) + "."
          : "Saisissez un nombre entier entre " + a + " et " + b + ".";
        input.value = afficher(ch, R[ch.k]);   // on revient à la dernière valeur valide
        return;
      }
      input.removeAttribute("aria-invalid"); err.textContent = "";
      R[ch.k] = v; input.value = afficher(ch, v); sauver(); maj();
    };
    const bouger = d => {
      R[ch.k] = clamp(R[ch.k] + d * ch.pas, LIMITES[ch.k]);
      input.value = afficher(ch, R[ch.k]);
      input.removeAttribute("aria-invalid"); err.textContent = "";
      sauver(); maj();
    };
    input.addEventListener("change", valider);
    input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    moins.addEventListener("click", () => bouger(-1));
    plus.addEventListener("click", () => bouger(1));
  });
}

/* ============================================================
   PUBLICITÉ : une simple bannière en bas, jamais bloquante.
   Si la configuration est vide ou si le chargement échoue, elle reste masquée.
   ============================================================ */
function initPub() {
  if (NATIF) { initAdMob(); return; }   // dans l’appli Android : AdMob, pas AdSense
  if (!AD_CLIENT || !AD_SLOT) return;
  try {
    const s = document.createElement("script");
    s.async = true; s.crossOrigin = "anonymous";
    s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(AD_CLIENT);
    s.onload = () => {
      try {
        const ins = document.createElement("ins");
        ins.className = "adsbygoogle";
        ins.style.cssText = "display:inline-block;width:320px;height:50px";
        ins.dataset.adClient = AD_CLIENT; ins.dataset.adSlot = AD_SLOT;
        $("ad").appendChild(ins);
        $("ad").hidden = false; document.body.classList.add("has-ad");
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {}
    };
    s.onerror = () => {};   // pas de réseau / bloqueur : on ne fait rien
    document.head.appendChild(s);
  } catch (e) {}
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
$("go").addEventListener("click", () => {
  if (etat === "run") pause(); else demarrer();
});
$("reset").addEventListener("click", reinitialiser);
construireChamps();
maj();
initPub();
</script>
</body>
</html>
