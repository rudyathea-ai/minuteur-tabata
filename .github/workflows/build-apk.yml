# Fabrique un APK de test dans le cloud GitHub (aucune installation locale nécessaire).
name: Construire l'APK
on:
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Préparer le projet Android
        run: bash setup.sh
      - name: Compiler l'APK de test
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: minuteur-tabata-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
